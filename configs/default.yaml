camera:
  source: webcam
  device_index: 0
  width: 1280
  height: 720
  target_fps: 30
  frame_queue_size: 2

detection:
  object_confidence_threshold: 0.25
  person_confidence_threshold: 0.60
  image_size: 416
  model_manifest: ./models/manifest.yaml
  device: null
  pose_interval_ms: 250
  hands_interval_ms: 200

behavior:
  head_turn:
    yaw_degrees: 22.0
    minimum_duration_seconds: 0.3
    fast_yaw_degrees: 32.0
    fast_duration_seconds: 0.2
    require_calibration: true
    neutral_degrees: 12.0
    neutral_duration_seconds: 0.3
  look_down:
    pitch_degrees: 15.0
    minimum_duration_seconds: 0.4
    fast_pitch_degrees: 28.0
    fast_duration_seconds: 0.2
  abnormal_head_movement:
    window_seconds: 30
    minimum_turn_count: 4
  phone:
    minimum_confidence: 0.55
    minimum_duration_seconds: 0.6
    release_confidence: 0.35
    maximum_gap_ms: 600
    fast_confidence: 0.85
    fast_duration_seconds: 0.2
    fast_min_hits: 2
  document:
    minimum_confidence: 0.70
    minimum_duration_seconds: 1.0
  person_missing:
    minimum_duration_seconds: 5.0
  multiple_person:
    minimum_duration_seconds: 2.0
  leaving_seat:
    minimum_duration_seconds: 2.0
  camera_blocked:
    minimum_duration_seconds: 2.0
  # Khi vẫn thấy người, mất mặt ngắn thường là cúi nhìn bàn (đo trên OEP 2026-10-16).
  face_not_visible:
    minimum_duration_seconds: 3.0
  hand_activity:
    minimum_duration_seconds: 5.0

# Ghi đè `behavior` theo kiểu bài thi; được chọn khi bắt đầu phiên và cố định trong phiên.
exam_modes:
  paper:
    # Thi giấy: cúi nhìn bài là bình thường; không có "màn hình" để nhìn ra ngoài.
    look_down:
      enabled: false
    gaze:
      off_screen_enabled: false
  computer:
    # Thi máy: chỉ cúi đầu kéo dài mới cần rà soát; liếc bàn phím ngắn thì không.
    look_down:
      minimum_duration_seconds: 3.0
      fast_enabled: false

risk:
  maximum_score: 100
  update_interval_ms: 250
  decay_per_second: 1.5
  # Khi không còn sự kiện hoạt động: giảm một nửa mỗi giây, dưới 0,5 về 0.
  recovery_half_life_seconds: 1.0
  active_event_ttl_seconds: 2
  correlation_window_seconds: 5
  correlation_confirmation_seconds: 0.25
  correlation_cap: 20

evidence:
  evidence_frame_enabled: false
  evidence_clip_enabled: false
  retention_days: 30

runtime:
  timezone: UTC
  max_active_sessions: 1

openapi: 3.1.0
info:
  title: Smart Exam Proctoring API
  version: 0.1.0
  description: >-
    Contract cho session, event, risk, policy, evidence và review. API chỉ cung cấp
    tín hiệu nghi vấn; không có endpoint kết luận gian lận.
  license:
    name: Chưa chốt; phải hoàn tất gate giấy phép Ultralytics trước khi phát hành
    identifier: LicenseRef-Unspecified
servers:
  - url: http://127.0.0.1:8000
security:
  - bearerAuth: []
tags:
  - name: Health
    description: Trạng thái dịch vụ, storage, database và analyzer.
  - name: Sessions
    description: Lifecycle và preview của phiên giám sát.
  - name: Events
    description: Sự kiện nghi vấn và đánh giá của reviewer.
  - name: Tracks
    description: Track ẩn danh của thí sinh trong session.
  - name: Evidence
    description: Truy cập evidence có authorization và audit.
  - name: Configuration
    description: Phiên bản cấu hình hệ thống.
  - name: Policies
    description: Quy tắc vật thể, evidence và retention của kỳ thi.

paths:
  /api/health:
    get:
      tags: [Health]
      summary: Kiểm tra trạng thái dịch vụ
      operationId: getHealth
      security: []
      responses:
        '200':
          description: Dịch vụ sẵn sàng hoặc đang degraded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '400':
          $ref: '#/components/responses/BadRequest'

  /api/sessions:
    post:
      tags: [Sessions]
      summary: Tạo session
      operationId: createSession
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SessionCreate'
      responses:
        '201':
          description: Session đã tạo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
    get:
      tags: [Sessions]
      summary: Liệt kê session
      operationId: listSessions
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/SessionStatus'
      responses:
        '200':
          description: Danh sách session
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Session'
                  next_cursor:
                    type: [string, 'null']
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/sessions/{session_id}:
    get:
      tags: [Sessions]
      summary: Lấy snapshot session
      operationId: getSession
      parameters:
        - $ref: '#/components/parameters/SessionId'
      responses:
        '200':
          description: Snapshot hiện tại
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionDetail'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/sessions/{session_id}/start:
    post:
      tags: [Sessions]
      summary: Bắt đầu monitoring
      operationId: startSession
      parameters:
        - $ref: '#/components/parameters/SessionId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '202':
          description: Đã nhận lệnh start
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionCommandResult'
        '409':
          description: Session đã dừng hoặc state hiện tại không cho phép start
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          $ref: '#/components/responses/Unprocessable'

  /api/sessions/{session_id}/stop:
    post:
      tags: [Sessions]
      summary: Dừng monitoring
      operationId: stopSession
      parameters:
        - $ref: '#/components/parameters/SessionId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '202':
          description: Đã nhận lệnh stop
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionCommandResult'
        '409':
          description: State hiện tại không cho phép stop
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/sessions/{session_id}/preview.mjpeg:
    get:
      tags: [Sessions]
      summary: Xem preview của session đang chạy
      operationId: streamPreview
      parameters:
        - $ref: '#/components/parameters/SessionId'
        - name: overlays
          in: query
          schema:
            type: boolean
            default: true
      responses:
        '200':
          description: Luồng multipart MJPEG
          content:
            multipart/x-mixed-replace:
              schema:
                type: string
                contentMediaType: image/jpeg
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/sessions/{session_id}/events:
    get:
      tags: [Events]
      summary: Liệt kê event của session
      operationId: listSessionEvents
      parameters:
        - $ref: '#/components/parameters/SessionId'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - name: track_id
          in: query
          schema:
            type: string
            format: uuid
        - name: event_type
          in: query
          schema:
            $ref: '#/components/schemas/EventType'
        - name: severity
          in: query
          schema:
            $ref: '#/components/schemas/Severity'
        - name: from
          in: query
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: Trang event theo thứ tự mới nhất trước
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/SuspiciousEvent'
                  next_cursor:
                    type: [string, 'null']
        '404':
          $ref: '#/components/responses/NotFound'

  /api/events/{event_id}:
    get:
      tags: [Events]
      summary: Lấy chi tiết event
      operationId: getEvent
      parameters:
        - $ref: '#/components/parameters/EventId'
      responses:
        '200':
          description: Event cùng evidence và review mới nhất
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventDetail'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/events/{event_id}/review:
    post:
      tags: [Events]
      summary: Ghi nhận đánh giá của reviewer
      description: Chỉ ghi chất lượng tín hiệu, không ghi phán quyết gian lận.
      operationId: reviewEvent
      parameters:
        - $ref: '#/components/parameters/EventId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReviewCreate'
      responses:
        '201':
          description: Review đã ghi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewDisposition'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/sessions/{session_id}/tracks:
    get:
      tags: [Tracks]
      summary: Liệt kê track trong session
      operationId: listTracks
      parameters:
        - $ref: '#/components/parameters/SessionId'
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/TrackStatus'
      responses:
        '200':
          description: Danh sách track ẩn danh
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CandidateTrack'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/evidence/{evidence_id}/content:
    get:
      tags: [Evidence]
      summary: Xem hoặc tải evidence
      description: Yêu cầu role reviewer hoặc admin; mọi lần gọi đều được audit.
      operationId: getEvidenceContent
      parameters:
        - name: evidence_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: disposition
          in: query
          description: inline để xem hoặc attachment để tải
          schema:
            type: string
            enum: [inline, attachment]
            default: inline
      responses:
        '200':
          description: Nội dung evidence
          headers:
            Content-Disposition:
              schema:
                type: string
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
            video/mp4:
              schema:
                type: string
                format: binary
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '410':
          description: Evidence đã hết retention hoặc đã xóa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/config:
    get:
      tags: [Configuration]
      summary: Lấy config đang active
      operationId: getActiveConfig
      responses:
        '200':
          description: Config và schema version
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemConfigVersion'
        '403':
          $ref: '#/components/responses/Forbidden'
    put:
      tags: [Configuration]
      summary: Tạo và kích hoạt config version mới
      operationId: updateConfig
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfigUpdate'
      responses:
        '200':
          description: Config mới đã active
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemConfigVersion'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/Unprocessable'

  /api/exam-policies:
    get:
      tags: [Policies]
      summary: Liệt kê exam policy
      operationId: listPolicies
      responses:
        '200':
          description: Danh sách policy
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ExamPolicy'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Policies]
      summary: Tạo exam policy
      operationId: createPolicy
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExamPolicyInput'
      responses:
        '201':
          description: Policy đã tạo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExamPolicy'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/exam-policies/{policy_id}:
    put:
      tags: [Policies]
      summary: Tạo version mới cho policy
      operationId: updatePolicy
      parameters:
        - name: policy_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExamPolicyInput'
      responses:
        '200':
          description: Version mới của policy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExamPolicy'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    SessionId:
      name: session_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    EventId:
      name: event_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    Cursor:
      name: cursor
      in: query
      schema:
        type: string
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 8
        maxLength: 128

  responses:
    BadRequest:
      description: Request không hợp lệ
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Chưa xác thực
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: Không đủ quyền
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Không tìm thấy tài nguyên
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: State hiện tại không cho phép thao tác
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unprocessable:
      description: Dữ liệu đúng cú pháp nhưng không đạt validation
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

  schemas:
    Error:
      type: object
      required: [code, message, request_id]
      properties:
        code:
          type: string
        message:
          type: string
        request_id:
          type: string
        details:
          type: object
          additionalProperties: true

    HealthResponse:
      type: object
      required: [status, version, database, storage, analyzers]
      properties:
        status:
          type: string
          enum: [healthy, degraded, unhealthy]
        version:
          type: string
        database:
          type: string
          enum: [ready, degraded, unavailable]
        storage:
          type: string
          enum: [ready, degraded, unavailable]
        analyzers:
          type: object
          additionalProperties:
            type: string
            enum: [ready, disabled, degraded, unavailable]

    SessionStatus:
      type: string
      description: STOPPED là terminal; start lặp cùng Idempotency-Key trả kết quả cũ, key mới trên session đã dừng trả 409.
      enum: [CREATED, STARTING, RUNNING, STOPPING, STOPPED, FAILED]

    SessionMode:
      type: string
      enum: [SINGLE_PERSON, MULTI_PERSON]

    RiskLevel:
      type: string
      enum: [NORMAL, LOW, MEDIUM, HIGH, CRITICAL]

    SessionCreate:
      type: object
      required: [name, mode, camera_source, policy_id]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        mode:
          $ref: '#/components/schemas/SessionMode'
        camera_source:
          type: string
          minLength: 1
        policy_id:
          type: string
          format: uuid

    Session:
      type: object
      required:
        - id
        - name
        - mode
        - status
        - current_risk_score
        - current_risk_level
        - camera_status
        - processing_status
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        mode:
          $ref: '#/components/schemas/SessionMode'
        status:
          $ref: '#/components/schemas/SessionStatus'
        current_risk_score:
          type: number
          minimum: 0
          maximum: 100
        current_risk_level:
          $ref: '#/components/schemas/RiskLevel'
        camera_status:
          type: string
          enum: [UNKNOWN, CONNECTED, DEGRADED, DISCONNECTED]
        processing_status:
          type: string
          enum: [IDLE, LOADING, READY, DEGRADED, FAILED]
        started_at:
          type: [string, 'null']
          format: date-time
        ended_at:
          type: [string, 'null']
          format: date-time
        failure_code:
          type: [string, 'null']
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    SessionDetail:
      allOf:
        - $ref: '#/components/schemas/Session'
        - type: object
          required: [policy_version, config_version, latest_sequence, active_tracks]
          properties:
            policy_version:
              type: integer
            config_version:
              type: integer
            latest_sequence:
              type: integer
              minimum: 0
            active_tracks:
              type: array
              items:
                $ref: '#/components/schemas/CandidateTrack'
            metrics:
              $ref: '#/components/schemas/RuntimeMetrics'

    SessionCommandResult:
      type: object
      required: [session_id, status, request_id]
      properties:
        session_id:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/SessionStatus'
        request_id:
          type: string

    TrackStatus:
      type: string
      enum: [ACTIVE, OCCLUDED, LOST, CLOSED]

    BoundingBox:
      type: object
      required: [x, y, width, height]
      properties:
        x: { type: number, minimum: 0, maximum: 1 }
        y: { type: number, minimum: 0, maximum: 1 }
        width: { type: number, minimum: 0, maximum: 1 }
        height: { type: number, minimum: 0, maximum: 1 }

    CandidateTrack:
      type: object
      required:
        - id
        - runtime_track_id
        - status
        - first_seen_at
        - last_seen_at
        - current_risk_score
        - current_risk_level
      properties:
        id:
          type: string
          format: uuid
        runtime_track_id:
          type: integer
        status:
          $ref: '#/components/schemas/TrackStatus'
        seat_region_id:
          type: [string, 'null']
          format: uuid
        bbox:
          oneOf:
            - $ref: '#/components/schemas/BoundingBox'
            - type: 'null'
        visibility:
          type: [number, 'null']
          minimum: 0
          maximum: 1
        first_seen_at:
          type: string
          format: date-time
        last_seen_at:
          type: string
          format: date-time
        current_risk_score:
          type: number
          minimum: 0
          maximum: 100
        current_risk_level:
          $ref: '#/components/schemas/RiskLevel'

    EventType:
      type: string
      enum:
        - HEAD_TURN_LEFT
        - HEAD_TURN_RIGHT
        - LOOK_DOWN
        - ABNORMAL_HEAD_MOVEMENT
        - PHONE_DETECTED
        - DOCUMENT_DETECTED
        - MULTIPLE_PERSON_DETECTED
        - PERSON_MISSING
        - LEAVING_SEAT
        - CAMERA_BLOCKED
        - FACE_NOT_VISIBLE
        - SUSPICIOUS_HAND_ACTIVITY
        - POSSIBLE_TALKING

    Severity:
      type: string
      enum: [LOW, MEDIUM, HIGH, CRITICAL]

    SuspiciousEvent:
      type: object
      required:
        - id
        - session_id
        - event_type
        - status
        - severity
        - confidence
        - risk_delta
        - risk_score_after
        - started_at
        - reason_codes
        - explanation
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
        session_id:
          type: string
          format: uuid
        track_id:
          type: [string, 'null']
          format: uuid
        event_type:
          $ref: '#/components/schemas/EventType'
        status:
          type: string
          enum: [OPEN, CLOSED]
        severity:
          $ref: '#/components/schemas/Severity'
        confidence:
          type: number
          minimum: 0
          maximum: 1
        risk_delta:
          type: number
        risk_score_after:
          type: number
          minimum: 0
          maximum: 100
        started_at:
          type: string
          format: date-time
        ended_at:
          type: [string, 'null']
          format: date-time
        duration_ms:
          type: [integer, 'null']
          minimum: 0
        reason_codes:
          type: array
          minItems: 1
          items: { type: string }
        explanation:
          type: string
        metrics:
          type: object
          additionalProperties: true
        evidence_status:
          type: string
          enum: [NONE, PENDING, AVAILABLE, PARTIAL, FAILED, DELETED]
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    EventDetail:
      allOf:
        - $ref: '#/components/schemas/SuspiciousEvent'
        - type: object
          required: [evidence, reviews]
          properties:
            evidence:
              type: array
              items:
                $ref: '#/components/schemas/EvidenceMetadata'
            reviews:
              type: array
              items:
                $ref: '#/components/schemas/ReviewDisposition'

    EvidenceMetadata:
      type: object
      required: [id, kind, status, retention_until, created_at]
      properties:
        id:
          type: string
          format: uuid
        kind:
          type: string
          enum: [FRAME, CLIP]
        status:
          type: string
          enum: [PENDING, AVAILABLE, FAILED, DELETED]
        media_type:
          type: [string, 'null']
        size_bytes:
          type: [integer, 'null']
          minimum: 0
        captured_from:
          type: [string, 'null']
          format: date-time
        captured_to:
          type: [string, 'null']
          format: date-time
        retention_until:
          type: string
          format: date-time
        failure_code:
          type: [string, 'null']
        created_at:
          type: string
          format: date-time

    ReviewCreate:
      type: object
      required: [disposition]
      properties:
        disposition:
          type: string
          enum: [VALID_SIGNAL, FALSE_POSITIVE, INCONCLUSIVE]
        note:
          type: string
          maxLength: 2000

    ReviewDisposition:
      allOf:
        - $ref: '#/components/schemas/ReviewCreate'
        - type: object
          required: [id, event_id, reviewed_by, reviewed_at]
          properties:
            id:
              type: string
              format: uuid
            event_id:
              type: string
              format: uuid
            reviewed_by:
              type: string
            reviewed_at:
              type: string
              format: date-time

    RuntimeMetrics:
      type: object
      required: [capture_fps, processed_fps, dropped_frames, latency_ms_p50, latency_ms_p95]
      properties:
        capture_fps: { type: number, minimum: 0 }
        processed_fps: { type: number, minimum: 0 }
        dropped_frames: { type: integer, minimum: 0 }
        latency_ms_p50: { type: number, minimum: 0 }
        latency_ms_p95: { type: number, minimum: 0 }
        analyzer_latency_ms:
          type: object
          additionalProperties:
            type: number
            minimum: 0

    SystemConfigVersion:
      type: object
      required: [id, version, status, content, sha256, created_at]
      properties:
        id:
          type: string
          format: uuid
        version:
          type: integer
          minimum: 1
        status:
          type: string
          enum: [DRAFT, ACTIVE, RETIRED]
        content:
          type: object
          additionalProperties: true
        sha256:
          type: string
          pattern: '^[a-f0-9]{64}$'
        created_at:
          type: string
          format: date-time

    ConfigUpdate:
      type: object
      required: [content]
      properties:
        expected_active_version:
          type: integer
          minimum: 1
        content:
          type: object
          additionalProperties: true

    ExamPolicyInput:
      type: object
      required:
        - name
        - allow_book
        - allow_scratch_paper
        - allow_phone
        - evidence_frame_enabled
        - evidence_clip_enabled
        - pre_event_seconds
        - post_event_seconds
        - retention_days
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        allow_book: { type: boolean }
        allow_scratch_paper: { type: boolean }
        allow_phone: { type: boolean }
        allowed_materials:

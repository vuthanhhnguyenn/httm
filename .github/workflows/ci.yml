name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    name: Python desktop checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.12.x"

      - name: Install desktop dependencies
        run: uv sync --no-default-groups --group dev --extra opencv-python

      - name: Python lint
        run: uv run ruff check .

      - name: Python type check
        run: uv run mypy apps/desktop/src packages/proctoring_core/src packages/proctoring_ai/src scripts

      - name: Python tests
        run: uv run pytest packages/proctoring_core/tests packages/proctoring_ai/tests tests
